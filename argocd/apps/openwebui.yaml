apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'repourl.git'
    targetRevision: HEAD
    path: apps/openwebui/overlays/production
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openwebui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

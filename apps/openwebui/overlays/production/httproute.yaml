apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-route
  namespace: openwebui
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: openwebui-listeners
      namespace: envoy-gateway-system
      sectionName: https-openwebui
  hostnames:
    - "odomain.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-webui
          port: 8080